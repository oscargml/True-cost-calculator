<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opportunity Cost Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "The True Cost Calculator",
      "url": "https://yourwebsite.com/opportunity-cost-calculator",
      "description": "An interactive opportunity cost calculator that computes the long-term investment value of your monthly subscription services over 10 years at an 8% return rate.",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "All",
      "browserRequirements": "Requires JavaScript. Requires HTML5.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Calculates yearly subscription expenses",
        "Calculates 10-year cumulative costs",
        "Calculates 10-year investment opportunity cost assuming an 8% annual return"
      ]
    }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-6">

    <div class="max-w-xl mx-auto mt-10 bg-white p-8 rounded-xl shadow-lg border border-gray-100">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-2">The True Cost Calculator</h1>
        <p class="text-center text-gray-500 mb-8">See what your monthly subscriptions are actually costing your future self.</p>

        <div class="mb-6">
            <label class="block text-sm font-semibold mb-2">Total Monthly Subscriptions ($)</label>
            <input type="number" id="monthlyCost" placeholder="e.g., 50" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
